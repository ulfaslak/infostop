name: Release

# Builds and tests the sdist and the wheels on every PR and every push to
# master. Uploads them to PyPI only when a tag `v<version>` is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  # No branch filter, so PRs stacked on other PRs build wheels too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-tag:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag is v + __version__ from infostop/metadata.py
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' infostop/metadata.py)
          echo "Tag: $TAG. Version in infostop/metadata.py: $version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match v$version from infostop/metadata.py"
            exit 1
          fi

      - name: Check that the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tagged commit is not on master. Push master, then re-run this job."
            exit 1
          fi

  sdist:
    name: Build the sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build the sdist and check its metadata
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Native runners only: no emulation, so every wheel is tested on the
        # architecture it was built for.
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-15-intel, arch: x86_64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: AMD64 }
    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Infomap has no macOS x86_64 wheels, and its source build (2.10 and
      # later) needs the OpenMP headers. Intel Mac users need the same; see
      # README "Installation".
      - name: Install libomp for Infomap's source build
        if: matrix.os == 'macos-15-intel'
        run: brew install libomp

      # Python versions, platforms and the test command are set in
      # [tool.cibuildwheel] in pyproject.toml.
      - name: Build and test the wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [check-tag, sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/infostop/
    permissions:
      # PyPI Trusted Publishing: PyPI trusts a short-lived token from GitHub
      # for this repository, this workflow file and the `pypi` environment.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Check that every file carries the tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -l dist
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          wheels=(dist/*.whl)
          if [ "${#sdists[@]}" -ne 1 ] || [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::Expected one sdist and at least one wheel"
            exit 1
          fi
          for file in dist/*; do
            case "$(basename "$file")" in
              "infostop-$version.tar.gz" | "infostop-$version-"*.whl) ;;
              *)
                echo "::error::$file is not version $version"
                exit 1
                ;;
            esac
          done

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
