name: CI

on:
  push:
    branches: [master]
  # No branch filter, so PRs stacked on other PRs are tested too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest and the highest supported Python on Linux. The highest
        # also on macOS and Windows, because the C++ extension is compiled by
        # a different compiler on each. Python 3.9 needs ubuntu-24.04:
        # setup-python has no 3.9 for ubuntu-latest (26.04). On 3.9, pip
        # compiles Infomap from source, as it has no wheels for 3.9.
        include:
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.14" }
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the sdist, then the wheel from the sdist
        run: |
          python -m pip install build
          python -m build --outdir dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl pytest

      - name: Run the tests against the installed package
        # Run outside the checkout, so that `import infostop` finds the
        # installed wheel and not the source tree.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import shutil, sys; shutil.copytree(sys.argv[1], 'tests')" "$GITHUB_WORKSPACE/tests"
          python - <<'EOF'
          import os, cpputils, infostop
          checkout = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          for module in (infostop, cpputils):
              path = os.path.realpath(module.__file__)
              print(f"{module.__name__}: {path}")
              if path.startswith(checkout + os.sep):
                  raise SystemExit(f"{module.__name__} was imported from the checkout")
          EOF
          python -m pytest -ra tests
